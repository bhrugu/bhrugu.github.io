name: Update Medium posts

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Medium feed into posts.json
        run: |
          python3 - <<'PY'
          import html, json, re, sys, urllib.request
          import xml.etree.ElementTree as ET
          from email.utils import parsedate_to_datetime

          URL = "https://medium.com/feed/@bhrugu.giri"
          req = urllib.request.Request(URL, headers={"User-Agent": "Mozilla/5.0 (compatible; feed-sync)"})
          try:
              raw = urllib.request.urlopen(req, timeout=30).read()
          except Exception as e:
              print("Feed fetch failed, keeping existing posts.json:", e)
              sys.exit(0)

          ns = {"c": "http://purl.org/rss/1.0/modules/content/"}
          posts = []
          for item in ET.fromstring(raw).iter("item"):
              body = item.findtext("c:encoded", default="", namespaces=ns) or item.findtext("description", default="")
              text = html.unescape(re.sub(r"<[^>]+>", " ", body))
              text = re.sub(r"\s+", " ", text).strip()
              title = item.findtext("title", default="").strip()
              if text.startswith(title):
                  text = text[len(title):].strip()
              if len(text) > 200:
                  text = text[:200].rsplit(" ", 1)[0] + "..."
              link = item.findtext("link", default="").split("?")[0]
              date = parsedate_to_datetime(item.findtext("pubDate")).strftime("%Y-%m-%d")
              posts.append({"title": title, "url": link, "date": date, "summary": text})

          if posts:
              with open("posts.json", "w", encoding="utf-8") as f:
                  json.dump(posts[:12], f, indent=2, ensure_ascii=False)
              print("Wrote", len(posts[:12]), "posts")
          PY

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain posts.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add posts.json
            git commit -m "Update Medium posts"
            git push
          fi